name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Build the Docker image
      run: docker build . --tag uselatex:ci
    - name: Test image by building CheatsheetTemplate
      run: |
        scripts/test-image.sh uselatex:ci
